[package]
name = "kimi-code-hud-rs"
version = "0.1.0"
edition = "2024"
description = "Single-binary HUD status line for Kimi Code CLI (Rust port): model, thinking, git, generation speed, cache hit rate and managed subscription quota."
license = "MIT"

[dependencies]
gix = { version = "0.85", default-features = false, features = ["basic", "status", "blob-diff", "revision", "index", "excludes", "attributes", "dirwalk", "sha1", "tree-editor"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2", default-features = false, features = ["tls"] }
url = "2"

[profile.release]
lto = true
strip = true
